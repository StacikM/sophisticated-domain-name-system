<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
        main {
            padding: 2rem;
        }
    </style>
    <title>Website Not Found</title>
</head>
<body>
    <header>
        <h1>Sophisticated Domain Name System</h1>
    </header>
    <h1>Website Not Found</h1>
    <p id="error">You were redirected to this page because the domain you tried to navigate to, no longer exists in our database</p>
    <p>It might have been removed</p>
    <a href="index.html">Home</a>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get("banned") == "true") {
            document.getElementById("error").textContent = "You were redirected to this page because the domain you tried to navigate to, has been blocked while we investigate it"
        }
    </script>
</body>
</html>
